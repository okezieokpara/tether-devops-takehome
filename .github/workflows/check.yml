---
name: Check
on:
  # Validate and lint Terraform, the playbooks and the workflows, as `make check` does.
  push:
    paths: &paths
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/**"
  pull_request:
    paths: *paths

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      # Rules are in terraform/.tflint.hcl.
      - name: TFLint
        run: |
          tflint --init
          tflint --format compact

  ansible:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    # inventory.ini is generated by Terraform, so point at a throwaway inventory.
    # Ansible wants a vault password to start, but neither check decrypts anything.
    env:
      ANSIBLE_VAULT_PASSWORD: unused
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The full `ansible` package bundles community.general, which the common role uses
      - name: Install Ansible
        run: pip install ansible ansible-lint

      - name: Syntax check
        run: ansible-playbook setup.yml deploy.yml verify.yml --syntax-check -i localhost,

      # Rules are in ansible/.ansible-lint.
      - name: Ansible Lint
        run: ansible-lint --nocolor

  workflows:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image bundles shellcheck, so run: scripts are checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: ShellCheck
        uses: docker://koalaman/shellcheck:v0.11.0
        with:
          args: ansible/vault-pass.sh
